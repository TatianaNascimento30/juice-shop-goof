version: 2.1

executors:
  snyk-executor:
    docker:
      - image: snyk/snyk-cli:latest
    working_directory: ~/repo

jobs:
  snyk-job:
    executor: snyk-executor
    steps:
      - checkout
      - run:
          name: Install Snyk
          command: npm install -g snyk
      - run:
          name: Test with Snyk Open Source
          command: snyk test --all-projects
      - run:
          name: Test with Snyk Code
          command: snyk code test
      - run:
          name: Monitor Snyk
          command: snyk monitor --all-projects

workflows:
  version: 2
  snyk-workflow:
    jobs:
      - snyk-job

    jobs:
      - test-node
